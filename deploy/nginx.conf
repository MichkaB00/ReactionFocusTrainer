server {
    listen 127.0.0.1:8080;
    listen [::1]:8080;
    server_name localhost 127.0.0.1;
    charset utf-8;
    client_max_body_size 1m;

    location /static/ {
        alias /var/www/focus-static/;
    }

    location / {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass 127.0.0.1:8001;
        uwsgi_read_timeout 30s;
    }
}
