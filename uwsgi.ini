[uwsgi]
strict = true
chdir = %d
home = %d/.venv-linux
module = config.wsgi:application
env = DJANGO_SETTINGS_MODULE=config.settings
socket = 127.0.0.1:8001
master = true
processes = 2
threads = 2
enable-threads = true
single-interpreter = true
need-app = true
vacuum = true
die-on-term = true
harakiri = 30
max-requests = 1000
