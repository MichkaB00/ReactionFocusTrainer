{% extends 'base.html' %}
{% block title %}Реєстрація — Фокус{% endblock %}
{% block content %}
    <section class="auth-page">
        <h1 id="register-heading">Реєстрація</h1>
        <form class="panel" method="post" action="{% url 'users:register' %}" aria-labelledby="register-heading">
            {% csrf_token %}
            {% include 'includes/form_fields.html' %}
            <button class="button full-width" type="submit">Зареєструватися</button>
        </form>
    </section>
{% endblock %}
